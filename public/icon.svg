<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="compassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Golden Compass Dial Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="8 8" opacity="0.6" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.8" />

  <!-- Cardinal Points -->
  <polygon points="256,92 262,112 250,112" fill="url(#goldGrad)" />
  <polygon points="256,420 262,400 250,400" fill="url(#goldGrad)" />
  <polygon points="92,256 112,262 112,250" fill="url(#goldGrad)" />
  <polygon points="420,256 400,262 400,250" fill="url(#goldGrad)" />

  <!-- Inner Compass Rose Star -->
  <g filter="url(#shadow)">
    <!-- North Point (Emerald/Teal) -->
    <polygon points="256,120 274,256 256,236" fill="#34d399" />
    <polygon points="256,120 238,256 256,236" fill="#059669" />

    <!-- South Point -->
    <polygon points="256,392 274,256 256,276" fill="#f59e0b" />
    <polygon points="256,392 238,256 256,276" fill="#b45309" />

    <!-- East Point -->
    <polygon points="392,256 256,238 276,256" fill="#fbbf24" />
    <polygon points="392,256 256,274 276,256" fill="#d97706" />

    <!-- West Point -->
    <polygon points="120,256 256,238 236,256" fill="#10b981" />
    <polygon points="120,256 256,274 236,256" fill="#047857" />
  </g>

  <!-- Central Emblem Ring -->
  <circle cx="256" cy="256" r="46" fill="#022c22" stroke="url(#goldGrad)" stroke-width="4" filter="url(#shadow)" />
  <!-- Center Star Core -->
  <circle cx="256" cy="256" r="16" fill="url(#goldGrad)" />

  <!-- Brand Subtext -->
  <text x="256" y="468" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#fbbf24" text-anchor="middle" letter-spacing="2">KENYA-QUEST-SAFARI</text>
</svg>
